<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Jyotish calculation example</title>
<h1>Fictional sample kundli</h1>
<p>1 January 2000, 12:00, Delhi. Period flags evaluated at 1 January 2026 UTC.</p>
<pre id="result">Calculating...</pre>
<script type="module">
import { kundli } from '../dist/index.js';
const chart = kundli({ year: 2000, month: 1, day: 1, hour: 12, minute: 0,
  lat: 28.6139, lon: 77.209, tz: 'Asia/Kolkata' }, '2026-01-01T00:00:00Z');
document.getElementById('result').textContent = JSON.stringify(chart, null, 2);
</script>
</html>
